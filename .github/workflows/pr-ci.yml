name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt
      - name: Check Rust compilation
        run: cargo check --target aarch64-linux-android
      # Legacy source files already fail rustfmt. Keep this visible as a warning
      # while making compilation the mandatory gate; enforce formatting after
      # a separate baseline cleanup.
      - name: Check Rust formatting (existing drift is advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Check shell script syntax
        run: bash -n build.sh
